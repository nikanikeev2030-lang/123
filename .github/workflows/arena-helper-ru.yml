name: Помощник на Арене Hearthstone APK
on:
  push:
    branches: [arena-helper-ru]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android API ${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORG_GRADLE_PROJECT_LICENSE_URL: ${{ vars.LICENSE_URL }}
    defaults:
      run:
        working-directory: arena-helper-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Single-device server tests
        run: |
          python3 -m pip install -r license-server/requirements.txt
          cd license-server
          python3 -m unittest -v
      - name: Start isolated license server for Android integration
        run: |
          python3 license-server/serve_ci.py > /tmp/arena-ci-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          test -s ci-license.txt
      - name: Tests, Android Lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Pomoshchnik-na-Arene-Hearthstone.apk
          sha256sum Pomoshchnik-na-Arene-Hearthstone.apk > Pomoshchnik-na-Arene-Hearthstone.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android visual recognition and capture tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: arena-helper-next
          script: |
            adb reverse tcp:8765 tcp:8765
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.serverLicense="$(cat ci-license.txt)"
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell am force-stop ru.arenahelper
            adb shell am start -n ru.arenahelper/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/launcher.png
            adb pull /sdcard/launcher.png launcher.png
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with:
          name: Pomoshchnik-na-Arene-Hearthstone-APK
          path: |
            arena-helper-next/Pomoshchnik-na-Arene-Hearthstone.apk
            arena-helper-next/Pomoshchnik-na-Arene-Hearthstone.apk.sha256
            arena-helper-next/README_RU.md
            arena-helper-next/launcher.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-api-${{ matrix.api }}
          path: |
            arena-helper-next/app/build/reports/tests/
            arena-helper-next/app/build/reports/lint-results-debug.*
            arena-helper-next/app/build/reports/androidTests/
            arena-helper-next/app/build/outputs/androidTest-results/
