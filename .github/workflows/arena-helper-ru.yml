name: Arena Helper RU APK
on:
  push:
    branches: [arena-helper-ru]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: arena-helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare offline Russian OCR
        run: python3 tools/fetch_ocr.py
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests, Android Lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Arena-Helper-RU.apk
          sha256sum Arena-Helper-RU.apk > Arena-Helper-RU.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Arena-Helper-RU-APK
          path: |
            arena-helper/Arena-Helper-RU.apk
            arena-helper/Arena-Helper-RU.apk.sha256
            arena-helper/README_RU.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            arena-helper/app/build/reports/tests/
            arena-helper/app/build/reports/lint-results-debug.*
