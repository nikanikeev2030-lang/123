services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - licenses:/data
  updater:
    build: .
    restart: unless-stopped
    command: ["python", "update_database.py", "--loop"]
    volumes:
      - licenses:/data
  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      LICENSE_DOMAIN: ${LICENSE_DOMAIN:?Set LICENSE_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  licenses:
  caddy_data:
  caddy_config:
